# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.1.0
group=com.dwinovo.numen
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Numen Bilibili Bridge
mod_author=dwinovo
mod_id=numen_bilibili_bridge
license=LGPL-3.0-only
credits=
description=Feeds Bilibili live-stream danmaku into Numen AI companions. Connects to a Bilibili live room, batches chat messages, and delivers them as world events to the in-game companion, which reads and reacts with its own model. The mod itself calls no LLM.
minecraft_version_range=[1.21.1, 1.21.2)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430

# numen-api engine this bridge talks to (compile-time only; provided at runtime by the numen mod)
numen_api_version=0.0.4-SNAPSHOT

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.116.7+1.21.1
fabric_loader_version=0.18.1

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=21.1.233
neoforge_loader_version_range=[4,)

# Bilibili transport uses java.net.http.HttpClient + WebSocket and java.util.zip.Inflater
# (all JDK built-ins) plus Gson (already on the MC classpath). No third-party dependencies.

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
